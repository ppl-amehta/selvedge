# ========================================================
# Litestream Continuous Streaming WAL Replication
# High-Reliability Zero-Data-Loss SQLite Replication
# ========================================================

dbs:
  - path: /data/selvedge.db
    replicas:
      # Primary S3/R2 Continuous Streaming Replica
      - type: s3
        bucket: "${LITESTREAM_BUCKET:-selvedge-backups}"
        path: "production/selvedge.db"
        endpoint: "${LITESTREAM_ENDPOINT:-https://<account_id>.r2.cloudflarestorage.com}"
        access-key-id: "${LITESTREAM_ACCESS_KEY_ID}"
        secret-access-key: "${LITESTREAM_SECRET_ACCESS_KEY}"
        sync-interval: 1s
        retention: 720h # 30 Days continuous point-in-time recovery
