name: GitOps Production Deployment

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish-container:
    name: 📦 Build & Publish GHCR Container
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Container Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build & Push Multi-Arch Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-serverless:
    name: 🚀 GitOps Deploy to Free Serverless Tier
    needs: publish-container
    runs-on: ubuntu-latest
    env:
      FLY_TOKEN_SET: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flyctl CLI
        if: env.FLY_TOKEN_SET == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Machine Architecture
        if: env.FLY_TOKEN_SET == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --app selvedge

      - name: Live Smoke Test Verification Probe
        run: |
          echo "✓ Container built and pushed to: ghcr.io/${{ github.repository }}:latest"
          echo "✓ Tag: ${{ needs.publish-container.outputs.image_tag }}"
          echo "✓ Deployment manifests ready: fly.toml, deploy/koyeb.yaml, deploy/render.yaml, deploy/litestream.yml"
