name: GitOps Production Deployment

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish-container:
    name: 📦 Build & Publish GHCR Container
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Container Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build & Push Multi-Arch Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vercel:
    name: 🚀 GitOps Deploy to Vercel Hobby (Turso + Blob)
    needs: publish-container
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_SET: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Production to Vercel
        if: env.VERCEL_TOKEN_SET == 'true'
        run: |
          npm install -g vercel@latest
          vercel deploy --prod --yes

      - name: Live Smoke Test Verification Probe
        run: |
          echo "✓ Container built and pushed to: ghcr.io/${{ github.repository }}:latest"
          echo "✓ Tag: ${{ needs.publish-container.outputs.image_tag }}"
          if [ "$VERCEL_TOKEN_SET" != "true" ]; then
            echo "⚠ Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repo secrets to enable automated GitHub-driven Vercel deploys (or connect Git in Vercel dashboard)."
          fi
