name: Selvedge Extreme CI & Quality Defense Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ----------------------------------------------------
  # Gate 1: Fast Static Analysis, Linting & Typecheck
  # ----------------------------------------------------
  lint-and-typecheck:
    name: 🔍 Lint & Static Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.27.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci --prefer-offline

      - name: Svelte 5 Type & Component Check
        run: |
          cd web
          npm run check

      - name: Go 1.27 Vet Analysis Gate
        run: |
          go vet ./...

      - name: Go 1.27 Staticcheck Analysis Gate
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  # ----------------------------------------------------
  # Gate 2: Race Detection & Concurrency Unit/Integration Tests
  # ----------------------------------------------------
  concurrency-and-tests:
    name: ⚡ Concurrency & Tests (-race)
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go with CGO dependencies
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Embedded Svelte 5 SPA
        run: |
          cd web
          npm ci --prefer-offline
          npm run build

      - name: Run Go Tests with Concurrency Race Detector
        run: |
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.txt
          retention-days: 7

  # ----------------------------------------------------
  # Gate 3: Security & Vulnerability Scanning (Govulncheck + Trivy)
  # ----------------------------------------------------
  security-and-cve-scan:
    name: 🛡️ Security & Secret Scanning Gates
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.27.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true

      - name: Run Govulncheck (Official Go Vulnerability Database)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Setup Trivy Scanner
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Aqua Security Trivy Filesystem & Secret Scan
        run: |
          trivy fs --scanners vuln,secret --skip-dirs web/node_modules,.git --exit-code 1 --severity CRITICAL,HIGH .

  # ----------------------------------------------------
  # Gate 4: Docker Multi-Stage Build & Image Verification
  # ----------------------------------------------------
  docker-build-verification:
    name: 🐳 Docker Multi-Stage Build Verification
    needs: [concurrency-and-tests, security-and-cve-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Multi-Arch Compilation Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: selvedge:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # Gate 5: OpenCode Compliance Audit Trail Proof
  # ----------------------------------------------------
  opencode-audit-check:
    name: 🤖 OpenCode Audit Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify OpenCode Execution Audit Log (Fail-Closed)
        run: |
          if [ -f ".agents/logs/opencode-mcp.log" ] && [ -f ".agents/logs/opencode-mcp.jsonl" ]; then
            echo "✓ OpenCode audit log verified:"
            sha256sum .agents/logs/opencode-mcp.log .agents/logs/opencode-mcp.jsonl
            wc -l .agents/logs/opencode-mcp.log .agents/logs/opencode-mcp.jsonl
          else
            echo "::error::Missing mandatory OpenCode audit log: .agents/logs/opencode-mcp.log or .agents/logs/opencode-mcp.jsonl"
            exit 1
          fi
